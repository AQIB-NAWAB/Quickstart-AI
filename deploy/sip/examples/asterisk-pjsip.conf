; ==============================================================================
; QuickStart AI - Asterisk PJSIP Configuration Example
;
; Purpose: Forward inbound calls from your Asterisk PBX to a QuickStart AI Agent.
; Location: /etc/asterisk/pjsip.conf (or include from pjsip_custom.conf)
; ==============================================================================

; 1. UDP Transport (adjust if already defined in your system)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; 2. Outbound Registration / Endpoint towards QuickStart SIP Edge
[quickstart-ai]
type=endpoint
transport=transport-udp
context=from-quickstart
disallow=all
allow=ulaw,alaw
direct_media=no
aors=quickstart-ai-aor
outbound_auth=quickstart-ai-auth

[quickstart-ai-auth]
type=auth
auth_type=userpass
username=YOUR_QUICKSTART_SIP_USERNAME
password=YOUR_QUICKSTART_SIP_PASSWORD

[quickstart-ai-aor]
type=aor
; Set to your LiveKit SIP Server host or IP (e.g. sip.example.com or 203.0.113.10)
contact=sip:YOUR_SIP_HOST:5060

; ==============================================================================
; Dialplan Integration Example (/etc/asterisk/extensions.conf)
; ==============================================================================
